[project]
name = "chatsearch"
version = "0.3.1"
description = "本地聊天记录全文检索：统一管理 WorkBuddy 与 DeepSeek Harness 会话"
requires-python = ">=3.11"
dependencies = [
    "pillow>=13.0.0",
    "watchdog>=7.1.0",
    "zstandard>=0.23",
]

[project.scripts]
chatsearch = "chatsearch.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatsearch"]

[tool.uv]
python-preference = "only-system"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
